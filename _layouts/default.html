<!DOCTYPE html>
<html lang="{{ page.lang | default: 'it' }}">
<head>
    <meta charset="UTF-8">
    <title>{{ page.title }} · {{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}">
    <meta property="og:title" content="{{ page.title }} · {{ site.title }}">
    <meta property="og:description" content="{{ page.description | default: site.description }}">
    <meta property="og:type" content="website">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <meta property="og:image" content="{{ page.image | default: '/images/ProfilePic.JPG' | absolute_url }}">
    <meta name="twitter:card" content="summary">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            background-color: #E0E0E0;
            color: #222832;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif, 
                   "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
        }

        h1, h2, h3, p, a, span, button, input {
            font-family: inherit;
        }

        body.dark-theme {
            background-color: #14181E;
            color: #E0E0E0;
        }

        /* Navigation Bar */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background-color: #E0E0E0;
            border-radius: 5px;
            color: #222832;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.2);
        }

        body.dark-theme nav {
            background-color: #222832;
            color: #E0E0E0;
            box-shadow: none;
        }

        .navbar-links {
            list-style-type: none;
            margin: 0;
            padding: 0;
            display: flex;
            gap: 20px;
        }

        .navbar-links li {
            margin-right: 20px;
        }

        .navbar-links li a {
            text-decoration: none;
            color: inherit;
            font-weight: bold;
            transition: color 0.3s, background-color 0.3s;
            padding: 8px 12px;
            border-radius: 5px;
        }

        body:not(.dark-theme) .navbar-links li a {
            color: #222832;
        }

        body:not(.dark-theme) .navbar-links li a:hover {
            color: #9c5ffd;
        }

        .navbar-links li a:hover {
            color: #9c5ffd; 
        }

        .navbar-buttons {
            display: flex;
            gap: 10px;
            align-items: center;
            height: 40px;
        }

        main {
            padding: 20px;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 60vh;
            padding: 40px 0;
            text-align: center;
        }

        .hero-banner {
            position: relative;
            /* Bleeds past main's own 20px padding to sit flush under the navbar and span edge-to-edge.
               (Deliberately not 100vw: that overshoots the real viewport width when a scrollbar is present,
               leaving a gap on the right.) */
            width: calc(100% + 40px);
            margin: 0 -20px;
            height: 220px;
            overflow: hidden;
        }

        .hero-banner-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            display: block;
        }

        .hero-fade {
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, rgba(224,224,224,0) 0%, rgba(224,224,224,1) 100%);
            pointer-events: none;
        }

        body.dark-theme .hero-fade {
            background: linear-gradient(to bottom, rgba(20,24,30,0) 0%, rgba(20,24,30,1) 100%);
        }

        @media (max-width: 500px) {
            .hero-banner { height: 130px; }
        }

        .profile-image-container {
            margin-bottom: 20px;
            transition: transform 0.3s ease;
        }

        /* Fixed dimensions here prevent the "enormous photo" flash */
        .profile-image {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 5px solid currentColor;
            cursor: pointer;
            transition: transform 0.3s ease, border-color 0.3s ease;
            object-fit: cover;
        }

        .profile-image:hover {
            transform: translateY(-10px);
            border-color: #9c5ffd;
        }

        .welcome-text h1, .welcome-text p {
            opacity: 0;
            transform: translateY(20px);
            animation: fadeIn 1s forwards;
        }

        .welcome-text h1 {
            animation-delay: 0.5s;
        }

        .welcome-text p {
            animation-delay: 1s;
        }

        /* Excludes .project-modal-overlay: its opacity is driven by the .open class (JS),
           and this animation's forwards fill-mode would otherwise permanently lock it
           at opacity:1 once it finishes, making the empty modal appear on page load and
           never actually disappear when closed. */
        body.animate-page main > *:not(.project-modal-overlay) {
            opacity: 0;
            transform: translateY(20px);
            animation: fadeIn 1s forwards;
            animation-delay: 0.2s;
        }

        @keyframes fadeIn {
          to {
            opacity: 1;
            transform: translateY(0);
          }
        }

        .social-icons {
            margin-top: 20px;
            display: flex;
            gap: 15px;
        }

        .social-icon {
            color: inherit;
            font-size: 30px;
            transition: color 0.3s;
        }

        .social-icon.linkedin:hover {
            color: #0077b5;
        }

        .social-icon.github:hover {
            color: #9c5ffd;
        }

        .social-icon.email:hover {
            color: #9c5ffd;
        }

        .tagline {
            font-size: 1rem;
            opacity: 0.75;
            margin-top: 0.3rem;
        }

        .cta-buttons {
            display: flex;
            gap: 0.75rem;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 1.75rem;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeIn 1s forwards;
            animation-delay: 1.4s;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            padding: 0.5rem 1.1rem;
            border-radius: 5px;
            font-size: 0.9rem;
            font-weight: 600;
            text-decoration: none;
            transition: background-color 0.2s, color 0.2s, border-color 0.2s;
            background-color: rgba(42, 157, 143, 0.15);
            color: #1a7a6e;
            border: 1.5px solid rgba(42, 157, 143, 0.4);
        }

        .btn:hover {
            text-decoration: none;
            background-color: #2a9d8f;
            color: #fff !important;
            border-color: #2a9d8f;
        }

        body.dark-theme .btn {
            background-color: rgba(42, 157, 143, 0.18);
            color: #5ecfc3;
            border-color: rgba(94, 207, 195, 0.35);
        }

        body.dark-theme .btn:hover {
            background-color: #2a9d8f;
            color: #fff !important;
            border-color: #2a9d8f;
        }

        /* Homepage CTA buttons use the site's purple accent instead of the teal used on the Projects page */
        .cta-buttons .btn {
            background-color: rgba(156, 95, 253, 0.15);
            color: #6d28d9;
            border-color: rgba(156, 95, 253, 0.4);
        }

        .cta-buttons .btn:hover {
            background-color: #9c5ffd;
            color: #fff !important;
            border-color: #9c5ffd;
        }

        body.dark-theme .cta-buttons .btn {
            background-color: rgba(156, 95, 253, 0.18);
            color: #c4b5fd;
            border-color: rgba(196, 181, 253, 0.35);
        }

        body.dark-theme .cta-buttons .btn:hover {
            background-color: #9c5ffd;
            color: #fff !important;
            border-color: #9c5ffd;
        }

        p a, li a {
            color: inherit; 
            text-decoration: none; 
            font-weight: bold; 
            transition: color 0.3s;
        }

        p a:hover, li a:hover {
            color: #9c5ffd;
            text-decoration: underline;
        }

        .theme-toggle-btn {
            background-color: transparent;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4px;
            transition: background-color 0.3s, box-shadow 0.3s;
            border-radius: 50%;
        }

        .language-toggle-btn {
             background-color: transparent;
             border: none;
             cursor: pointer;
             display: flex;
             align-items: center;
             justify-content: center;
             padding: 5px;
             transition: background-color 0.3s, box-shadow 0.3s;
             border-radius: 50%;
        }

        body:not(.dark-theme) .theme-toggle-btn:hover,
        body:not(.dark-theme) .language-toggle-btn:hover {
            background-color: rgba(0, 0, 0, 0.1);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .theme-toggle-btn:hover,
        .language-toggle-btn:hover {
            background-color: #555;
            box-shadow: 0 4px 8px #555;
        }

        .theme-toggle-btn svg {
            width: 24px;
            height: 24px;
            fill: inherit;
            transition: fill 0.3s;
        }

        body.dark-theme #theme-icon {
            fill: #E0E0E0;
        }

        body:not(.dark-theme) #theme-icon {
            fill: #222832;
        }

        .theme-toggle-btn:hover #theme-icon {
            fill: #9c5ffd !important;
        }

        .about-profile {
            width: 150px;
            height: 150px; 
            border-radius: 50%; 
            float: left; 
            margin-right: 45px; 
            border: 5px solid currentColor;
            margin-bottom: 15px;
            object-fit: cover;
        }

        @media (max-width: 500px) {
            .navbar-links { width: 100%; gap: 5px; }
            .navbar-links li { margin: 10px 0; }
            .navbar-buttons { gap: 5px; }
            main { padding: 10px; }
            .container { height: auto; padding: 70px 10px; }
            .profile-image { width: 100px; height: 100px; }
            .social-icons { justify-content: center; flex-wrap: wrap; }
            .social-icon { font-size: 24px; }
            .about-profile{ width: 100px; height: 100px; margin-right: 30px; }
        }
    </style>
</head>
<body class="{% if page.title != 'Home' %}animate-page{% endif %}">
    <script>
        if (localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark-theme');
        }
    </script>

    <nav class="navbar">
        <ul class="navbar-links">
            {% assign lang = page.lang | default: 'it' %}
            {% for item in site.navigation[lang] %}
                <li><a href="{{ item.url | relative_url }}">{{ item.title }}</a></li>
            {% endfor %}
        </ul>
        <div class="navbar-buttons">
            <button id="theme-toggle" class="theme-toggle-btn">
                <svg id="theme-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
                    <path id="sun-icon" d="M361.5 1.2c5 2.1 8.6 6.6 9.6 11.9L391 121l107.9 19.8c5.3 1 9.8 4.6 11.9 9.6s1.5 10.7-1.6 15.2L446.9 256l62.3 90.3c3.1 4.5 3.7 10.2 1.6 15.2s-6.6 8.6-11.9 9.6L391 391 371.1 498.9c-1 5.3-4.6 9.8-9.6 11.9s-10.7 1.5-15.2-1.6L256 446.9l-90.3 62.3c-4.5 3.1-10.2 3.7-15.2 1.6s-8.6-6.6-9.6-11.9L121 391 13.1 371.1c-5.3-1-9.8-4.6-11.9-9.6s-1.5-10.7 1.6-15.2L65.1 256 2.8 165.7c-3.1-4.5-3.7-10.2-1.6-15.2s6.6-8.6 11.9-9.6L121 121 140.9 13.1c1-5.3 4.6-9.8 9.6-11.9s10.7-1.5 15.2 1.6L256 65.1 346.3 2.8c4.5-3.1 10.2-3.7 15.2-1.6zM160 256a96 96 0 1 1 192 0 96 96 0 1 1 -192 0zm224 0a128 128 0 1 0 -256 0 128 128 0 1 0 256 0z"/>
                </svg>
            </button>
            <button id="language-toggle" class="language-toggle-btn">
                <img id="language-icon" src="{{ '/images/Flag_UK.svg' | relative_url }}" alt="Language toggle" width="24">
            </button>
        </div>
    </nav>

    <main>
        {{ content }}
    </main>

    <script>
        // Dark/Light theme logic
        const themeToggle = document.getElementById('theme-toggle');
        const themeIcon = document.getElementById('theme-icon');
        const moonPath = `<path id="moon-icon" d="M223.5 32C100 32 0 132.3 0 256S100 480 223.5 480c60.6 0 115.5-24.2 155.8-63.4c5-4.9 6.3-12.5 3.1-18.7s-10.1-9.7-17-8.5c-9.8 1.7-19.8 2.6-30.1 2.6c-96.9 0-175.5-78.8-175.5-176c0-65.8 36-123.1 89.3-153.3c6.1-3.5 9.2-10.5 7.7-17.3s-7.3-11.9-14.3-12.5c-6.3-.5-12.6-.8-19-.8z"/>`;
        const sunPath = `<path id="sun-icon" d="M361.5 1.2c5 2.1 8.6 6.6 9.6 11.9L391 121l107.9 19.8c5.3 1 9.8 4.6 11.9 9.6s1.5 10.7-1.6 15.2L446.9 256l62.3 90.3c3.1 4.5 3.7 10.2 1.6 15.2s-6.6 8.6-11.9 9.6L391 391 371.1 498.9c-1 5.3-4.6 9.8-9.6 11.9s-10.7 1.5-15.2-1.6L256 446.9l-90.3 62.3c-4.5 3.1-10.2 3.7-15.2 1.6s-8.6-6.6-9.6-11.9L121 391 13.1 371.1c-5.3-1-9.8-4.6-11.9-9.6s-1.5-10.7 1.6-15.2L65.1 256 2.8 165.7c-3.1-4.5-3.7-10.2-1.6-15.2s6.6-8.6 11.9-9.6L121 121 140.9 13.1c1-5.3 4.6-9.8 9.6-11.9s10.7-1.5 15.2 1.6L256 65.1 346.3 2.8c4.5-3.1 10.2-3.7 15.2-1.6zM160 256a96 96 0 1 1 192 0 96 96 0 1 1 -192 0zm224 0a128 128 0 1 0 -256 0 128 128 0 1 0 256 0z"/>`;

        themeToggle.addEventListener('click', () => {
            document.body.classList.toggle('dark-theme');
            const isDark = document.body.classList.contains('dark-theme');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            themeIcon.innerHTML = isDark ? moonPath : sunPath;
        });

        // Set initial icon based on established theme
        if (localStorage.getItem('theme') === 'dark') {
            themeIcon.innerHTML = moonPath;
        }

        // Languages changes
        document.addEventListener("DOMContentLoaded", function () {
            const languageToggle = document.getElementById("language-toggle");
            const languageIcon = document.getElementById("language-icon");
        
            if (window.location.pathname === "/" || window.location.pathname === "/raphsa.github.io/") {
                const userLang = navigator.language || navigator.userLanguage;
                const defaultLang = userLang.startsWith("it") ? "it" : "en";
                window.location.href = `/${defaultLang}/`;
                return;
            }

            let currentLang = window.location.pathname.includes("/en/") ? "en" : "it";
            languageIcon.src = currentLang === "it" ? "{{ '/images/Flag_UK.svg' | relative_url }}" : "{{ '/images/Flag_IT.svg' | relative_url }}";
            languageIcon.alt = currentLang === "it" ? "Switch to English" : "Passa all'italiano";

            languageToggle.addEventListener("click", function () {
                let newLang = currentLang === "it" ? "en" : "it";
                let newPath = window.location.pathname.replace(`/${currentLang}/`, `/${newLang}/`);
                window.location.href = newPath;
            });

            // Reload on profile image click
            const profImg = document.getElementById('profileImage');
            if(profImg) {
                profImg.addEventListener('click', () => location.reload());
            }
        });
    </script>
</body>
</html>
