title: Raffaele Sali personal website
email: raffaele.sali2@unibo.it
description: >- # this means to ignore newlines until "baseurl:"
  Here you can find information and exercises about the courses I'm tutoring and more.
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://raphsa.github.io"
github_username:  raphsa
social_links:
  linkedin: "https://www.linkedin.com/in/raffaelesali"
# Build settings
theme: minima
plugins:
  - jekyll-feed

languages:
  - it
  - en

default_lang: en

navigation:
  it:
    - title: Home
      url: /it/
    - title: Corsi
      url: /it/courses/
    - title: Progetti
      url: /it/projects/
    - title: About
      url: /it/about/

  en:
    - title: Home
      url: /en/
    - title: Courses
      url: /en/courses/
    - title: Projects
      url: /en/projects/
    - title: About
      url: /en/about/

exclude:
  - informatica-book
