- id: IOT_Proj
  title: "A Dual-Purpose IoT System Using Raspberry Pi Pico W and BMP280: Design and Development of a Weather Station and a Thermal Comfort–Based HVAC Simulation"
  description: |
    Final project for the Internet of Things course @UniOulu.
    An end-to-end IoT-based thermal comfort monitoring system was built around a Raspberry Pi Pico W and a BMP280 sensor for temperature and pressure acquisition.
    The system collects environmental data using the BMP280 sensor connected to the Pico, streams it to InfluxDB through a cloud-based pipeline exploiting MQTT protocol (where HiveMQ was chosen as MQTT broker) and Node-RED, performs comfort prediction using a logistic regression model, and visualizes results in real time across dashboards in Grafana and a mobile application built with Flutter and Flask Rest API.
  status: done
