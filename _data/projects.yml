- id: VR_Proj
  title: "Virtual Reality Escape Room for Google Cardboard in Unity"
  description: |
    Final project of the VR Systems course @UniOulu.
    A Escape Room game was developed, based on head movement and gaze-based selection.
    The game include different features:
    - The player can teleport anywhere in the scene by twisting the head left or right by approximately 30°.
    - Objects can be selected by gazing at them continuously for 2 seconds.
    - Hint messages are spread throughout the environmental.
    The goal of the game is to explore the environment, discover hints, interact with objects, and ultimately open the door to escape the room.
