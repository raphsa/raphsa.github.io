    - Google Cardboard
    - Escape Room

- id: CDMO_proj
  title: "Exploration of different Optimization Paradigms for the Sport Tournament Scheduling problem"
  description: |
    Final project for the Combinatorial Decision Making and Optimization course @UniBo.
    An in-depth study of the Sport Tournament Scheduling (STS) problem was developed. STS was addressed within a unified framework that employs four optimization approaches: Constraint Programming (CP), Boolean Satisfiability (SAT), Satisfiability Modulo Theories (SMT) and Mixed Integer Programming (MIP).
    The Circle Method was implemented for the initial schedule generation, reducing the time taken to find a solution.
  status: done
  credits_url: ""
  dataset_url: ""
  report_url: "https://github.com/raphsa/TournamentScheduling_CDMO/blob/main/report/CDMO_report.pdf"
  repo_url: "https://github.com/raphsa/TournamentScheduling_CDMO"
  tags:
    - Python
    - MiniZinc
    - AMPL
    - Docker
    - Constraint Programming
    - Boolean Satisfiability
    - Satisfiability Modulo Theories
    - Mixed Integer Programming

