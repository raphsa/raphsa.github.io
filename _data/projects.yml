- id: NLP_LLM
  title: "From PDF to Knowledge Graph for fine-tuning an LLM"
  description: |
    Final project for the NLP course @UniOulu. A complete NLP pipeline that transforms a domain-specific PDF into structured knowledge, generates instruction-response pairs, and fine-tunes a LLM based on that knowledge was built. 
    The end goal was to evaluate whether LLM fine-tuning on grounded knowledge improves factual accuracy compared to retrieval-based (RAG) or zero-shot baselines.
  status: done
