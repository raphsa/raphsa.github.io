- id: ipcv_proj
  title: "Books recognition on shelves & breeds of cats and dogs classification"
  description: |
    Final project for the Image Processing and Computer Vision course @UniBo consisting in two assignments: 
    1) A Multi-Instance Object detection system has been developed to identiy books in shelves given a reference image for each book. Clahe was used for Preprocessing step, RootSIFT was chosen for detecting features, BF 5NN consecutive ratio test was applied for matching instances with an iterative detection with keypoint index exclusion to handle multiple copies efficiently. Similarity transform (with 4 DOF) has been used as geometric model.
    2) First, a CNN trained from scratch on OxfordPetDataset has been implemented, based on the ResNet style, including Stem Layer, BatchNormalization, AdaptiveAveragePooling, Dropout. For training purposes AdamW, OneCycleLR with Cosine annealing, Cross-entropy loss with Label Smoothing and Gradient norm clipping were employed. For data augmentation purposes, MixUp was implemented. An ablation study has been developed to to evaluate the impact of each component in the network. Then, the ResNet-18 was fine tuned as a comparison, looking for the bes training hyperparameters.  
  status: done
  credits_url: ""
  dataset_url: ""
  report_url: ""
  repo_url: "https://github.com/raphsa/BooksDetection_PetClassification/tree/main"
