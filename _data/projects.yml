- id: DL_Proj_Oulu
  title: "Multi-Label Retinal Disease Classification"
  description: |
    Implemented multiple multi-label retinal disease classification models exploiting transfer learning, ResNet18 and EfficientNet architectures under various fine-tuning strategies.
    Retinal diseases such as Diabetic Retinopathy (DR), Glaucoma and Age-related Macular Degeneration (AMD) are leading causes of blindness. Datasets like ODIR are often small and imbalanced.
    To address class imbalance and limited data, Squeeze-and-Excitation (SE), Multi-head Self Attention (MHA) and Conditional Variational Autoencoders (CVAE) for synthetic data augmentation were explored. 
