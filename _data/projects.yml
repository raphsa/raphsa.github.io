- id: AffComp_Proj
  title: "Facial Micro-expressions recognition and classification"
  description: |
    Final project for the Affective Computing course @UniOulu.
    Developed different Deep Learning model architectures for the micro-expression recognition, considering different feature representations derived from the facial image sequences. In parallel, the best performer model was trained and the video processing and annotation pipeline was prepared. Project also considers recognition and classification of facial micro-expression action units (AUs) from the feature sequences as an auxiliary target for our models.
    Facial micro-expressions are spontaneous, subtle, and rapid muscle movements (often <200ms), which can be used to discover the true feelings that humans may hide.
    Developing reliable AU and micro expression recognition models is very challenging because the signals are brief, low-amplitude, noisy, and amount of training data is very limited. To tackle the problem of low-amplitude and noisy data, state-of-art image and signal analysis methods were used, like Eulerian Motion Magnification, Gunnar Farnebäck’s optical flow, with consequent computation of optical strains using Sobel kernels, Local Binary Patterns (LBPs), and block-wise 3D Fast Fourier Transform. 
    Mainly three multitask deep architectures were trained and compared:
    - 3D-CNN
    - 2D-CNN image encoder with bidirectional LSTM
    - Transformer
  status: done
  credits_url: ""
  dataset_url: ""
  report_url: "https://github.com/raphsa/ME-based-emotion-classifier/blob/main/report/main.pdf"
  repo_url: "https://github.com/raphsa/ME-based-emotion-classifier"
